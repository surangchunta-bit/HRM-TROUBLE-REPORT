<!DOCTYPE html>
<html lang="th" data-uacj="qic">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QIC LINER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffdf0;--surface:#fff;--surface-alt:#fffef8;--border:#f0dfb4;--border-light:#f7edce;--accent:#ca8a04;--accent-bg:#fef9c3;--accent-hover:#a16207;--accent-ring:#ca8a0430;--red:#dc2626;--red-bg:#fef2f2;--green:#15803d;--green-bg:#f0fdf4;--blue:#2563eb;--blue-bg:#eff6ff;--text:#1c1917;--text-sec:#57534e;--text-muted:#a8a29e;--shadow-sm:0 1px 3px rgba(0,0,0,.04);--shadow:0 1px 3px rgba(0,0,0,.05),0 4px 12px rgba(0,0,0,.04);--radius:12px;--radius-lg:16px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'IBM Plex Sans Thai',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.65;font-size:16px;-webkit-font-smoothing:antialiased;}
.app{max-width:880px;margin:0 auto;padding:28px 20px 40px;}

/* HEADER */
.header{text-align:center;margin-bottom:32px;padding:36px 24px 32px;}
.header-badge{width:68px;height:68px;margin:0 auto 14px;background:linear-gradient(135deg,#fef9c3,#fde68a);border:2px solid #fbbf24;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 4px 16px #ca8a0425;}
.header h1{font-size:28px;font-weight:700;letter-spacing:-.5px;}
.header p{font-size:16px;color:var(--text-muted);margin-top:6px;}

/* PAGE TABS */
.page-tabs{display:flex;gap:6px;margin-bottom:24px;background:var(--surface);border-radius:var(--radius);padding:5px;border:1px solid var(--border);box-shadow:var(--shadow-sm);}
.page-tab{flex:1;padding:11px 8px;border:none;background:transparent;color:var(--text-muted);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;border-radius:8px;transition:all .2s;}
.page-tab:hover{color:var(--text-sec);background:var(--accent-bg);}
.page-tab.active{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;box-shadow:0 2px 10px #ca8a0440;}
.page-tab .badge-c{display:inline-block;min-width:18px;height:18px;background:var(--red);color:#fff;border-radius:9px;font-size:10px;font-weight:700;line-height:18px;text-align:center;padding:0 4px;margin-left:3px;vertical-align:middle;}
.page-tab.active .badge-c{background:rgba(0,0,0,.2);}

/* SECTIONS */
.sec{display:none;animation:fadeUp .3s ease;}
.sec.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* CARD */
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);margin-bottom:16px;box-shadow:var(--shadow);overflow:hidden;transition:opacity .35s,box-shadow .35s;}
.card.collapsed{opacity:.5;box-shadow:var(--shadow-sm);}
.card-header{display:flex;align-items:center;gap:14px;padding:18px 22px;user-select:none;}
.card-title{font-size:18px;font-weight:700;flex:1;}
.card.collapsed .card-title{color:var(--text-muted);}
.card-body{padding:4px 22px 24px;max-height:6000px;overflow:hidden;transition:max-height .45s cubic-bezier(.4,0,.2,1),opacity .3s,padding .35s;opacity:1;}
.card.collapsed .card-body{max-height:0;opacity:0;padding-top:0;padding-bottom:0;}

/* TOGGLE */
.toggle{position:relative;display:inline-flex;cursor:pointer;flex-shrink:0;}
.toggle input{position:absolute;opacity:0;width:0;height:0;}
.toggle-track{width:52px;height:28px;background:#d6d3cc;border-radius:14px;position:relative;transition:background .25s;}
.toggle-track::after{content:'';position:absolute;width:22px;height:22px;background:#fff;border-radius:50%;top:3px;left:3px;transition:transform .25s cubic-bezier(.4,0,.2,1);box-shadow:0 1px 4px rgba(0,0,0,.15);}
.toggle input:checked+.toggle-track{background:var(--accent);}
.toggle input:checked+.toggle-track::after{transform:translateX(24px);}

/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.form-grid .full{grid-column:1/-1;}
.form-group{display:flex;flex-direction:column;gap:7px;}
.form-group label{font-size:15px;font-weight:600;color:var(--text-sec);}
.form-group label .req{color:var(--red);margin-left:3px;}
input,select,textarea{font-family:'IBM Plex Sans Thai',sans-serif;font-size:16px;padding:12px 16px;background:var(--surface-alt);border:1.5px solid var(--border);border-radius:10px;color:var(--text);transition:border-color .2s,box-shadow .2s,background .2s;outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring);background:#fff;}
textarea{resize:vertical;line-height:1.8;}

/* CHIPS */
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
.chip{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--surface-alt);color:var(--text-sec);font-family:inherit;transition:all .2s;user-select:none;}
.chip:hover{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);transform:translateY(-1px);}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px #ca8a0430;}
.chip-sm{padding:5px 12px;font-size:12px;}
.chip-pos{background:#f0f9ff;color:#0369a1;border-color:#bae6fd;}
.chip-pos.active{background:#0369a1;color:#fff;border-color:#0369a1;}

/* BUTTONS */
.actions{display:flex;gap:14px;margin-top:10px;}
.btn{flex:1;padding:16px 28px;border:none;border-radius:var(--radius);font-family:'IBM Plex Sans Thai',sans-serif;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .2s;}
.btn-primary{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;}
.btn-primary:hover{background:linear-gradient(135deg,#d97706,#b45309);transform:translateY(-2px);box-shadow:0 6px 20px #ca8a0440;}
.btn-secondary{background:var(--surface);border:1.5px solid var(--border);color:var(--text-sec);}
.btn-secondary:hover{background:var(--surface-alt);transform:translateY(-2px);box-shadow:var(--shadow);}
.btn-add{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border:2px dashed var(--border);background:transparent;color:var(--text-muted);border-radius:10px;cursor:pointer;font-family:inherit;font-size:15px;font-weight:600;transition:all .15s;}
.btn-add:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg);}
.btn-rm{width:36px;height:36px;border:1.5px solid var(--border);background:var(--surface);color:var(--text-muted);border-radius:10px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
.btn-rm:hover{border-color:var(--red);color:var(--red);background:var(--red-bg);}

/* TOAST */
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--green);color:#fff;padding:14px 28px;border-radius:var(--radius);font-weight:700;font-size:15px;z-index:2000;opacity:0;transition:all .4s cubic-bezier(.16,1,.3,1);box-shadow:0 8px 32px rgba(21,128,61,.3);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:3000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;}
.modal-overlay.show{opacity:1;pointer-events:all;}
.modal-box{background:var(--surface);border-radius:var(--radius-lg);padding:36px 32px 28px;max-width:420px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2);transform:scale(.92);transition:transform .3s cubic-bezier(.16,1,.3,1);}
.modal-overlay.show .modal-box{transform:scale(1);}
.modal-icon{font-size:48px;margin-bottom:14px;display:block;}
.modal-box h3{font-size:20px;font-weight:700;margin-bottom:10px;color:var(--red);}
.modal-box p{font-size:16px;color:var(--text-sec);line-height:1.7;margin-bottom:22px;}
.modal-box .btn{max-width:200px;margin:0 auto;}

/* PREVIEW */
.preview-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;}
.preview-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.preview-header h3{font-size:18px;font-weight:700;}
.preview-badge{font-size:13px;font-weight:600;padding:3px 12px;border-radius:6px;background:var(--accent-bg);color:var(--accent);border:1.5px solid #fde68a;}
.preview-box{padding:24px;font-size:16px;line-height:1.9;white-space:pre-wrap;word-break:break-word;font-family:'IBM Plex Sans Thai',sans-serif;max-height:600px;overflow-y:auto;color:var(--text);background:var(--surface-alt);}

/* HISTORY */
.history-empty{text-align:center;padding:60px 20px;color:var(--text-muted);}
.history-empty .h-icon{font-size:48px;margin-bottom:12px;display:block;}
.history-empty h3{font-size:18px;font-weight:600;color:var(--text-sec);margin-bottom:6px;}
.history-empty p{font-size:14px;}
.history-list{display:flex;flex-direction:column;gap:12px;}
.history-item{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;transition:box-shadow .2s,border-color .2s;}
.history-item:hover{border-color:#d4a843;}
.history-head{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;user-select:none;}
.history-head .h-date{min-width:54px;height:54px;background:var(--accent-bg);border:1.5px solid #fde68a;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
.history-head .h-date .h-day{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:var(--accent);line-height:1;}
.history-head .h-date .h-month{font-size:11px;font-weight:600;color:var(--text-muted);}
.history-head .h-info{flex:1;min-width:0;}
.history-head .h-title{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.history-head .h-sub{font-size:13px;color:var(--text-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.history-head .h-arrow{font-size:18px;color:var(--text-muted);transition:transform .3s;flex-shrink:0;}
.history-item.open .h-arrow{transform:rotate(180deg);}
.history-detail{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1);}
.history-item.open .history-detail{max-height:800px;}
.history-detail-inner{padding:0 20px 20px;border-top:1px solid var(--border);}
.history-preview{font-size:13px;line-height:1.8;white-space:pre-wrap;word-break:break-word;background:var(--surface-alt);border:1px solid var(--border-light);border-radius:10px;padding:14px 16px;margin:14px 0;max-height:220px;overflow-y:auto;color:var(--text-sec);font-family:'IBM Plex Sans Thai',sans-serif;}
.history-actions{display:flex;gap:10px;}
.history-actions .btn{font-size:14px;padding:10px 20px;}
.btn-load{background:var(--accent-bg);border:1.5px solid #fde68a;color:var(--accent);}
.btn-load:hover{background:var(--accent);color:#fff;}
.btn-del-h{background:var(--surface-alt);border:1.5px solid var(--border);color:var(--text-muted);}
.btn-del-h:hover{background:var(--red-bg);border-color:var(--red);color:var(--red);}
.btn-clr{background:var(--red-bg);border:1.5px solid #fecaca;color:var(--red);font-size:13px;padding:6px 16px;flex:unset;}
.btn-clr:hover{background:var(--red);color:#fff;}
.history-count-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding:10px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
.history-count-bar span{font-size:14px;font-weight:600;color:var(--text-sec);}

/* QIC ENTRIES */
.qic-entry{background:var(--surface-alt);border:1.5px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:14px;}
.qic-entry-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.qic-entry-head .h-title{flex:1;font-size:16px;font-weight:600;}
.step-num{min-width:32px;height:32px;border-radius:50%;background:var(--accent-bg);color:var(--accent);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1.5px solid #fde68a;}
.defect-sub{margin-top:10px;padding:12px 14px;background:var(--accent-bg);border:1px solid #fde68a;border-radius:10px;}
.defect-sub label{font-size:14px;font-weight:600;color:var(--text-sec);margin-bottom:6px;display:block;}
.defect-sub .form-grid{gap:10px;}
.plate-sel{margin-top:6px;font-size:13px;color:var(--accent);font-weight:600;}

/* SLAB COMPACT QTY ROW */
.slab-qty-row{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1.5px dashed #fde68a;flex-wrap:wrap;}
.slab-qty-row .sq-label{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap;margin-right:2px;}
.slab-qty-item{display:flex;align-items:center;gap:5px;background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:6px 10px;}
.slab-qty-item .qi-icon{font-size:14px;}
.slab-qty-item .qi-text{font-size:12px;font-weight:600;color:var(--text-sec);white-space:nowrap;}
.slab-qty-item input[type="number"]{
  width:42px;
  padding:4px 2px;
  text-align:center;
  font-family:'JetBrains Mono',monospace;
  font-size:18px;
  font-weight:600;
  border:none;
  background:transparent;
  color:var(--text);
  outline:none;
  -moz-appearance:textfield;
  border-radius:0;
}
.slab-qty-item input[type="number"]::-webkit-outer-spin-button,
.slab-qty-item input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.slab-qty-item input[type="number"]::placeholder{color:var(--text-muted);font-size:13px;font-weight:400;}
.slab-qty-item .qi-unit{font-size:11px;color:var(--text-muted);font-weight:600;}
.slab-qty-item.need-i{border-left:3px solid var(--blue);}
.slab-qty-item.can-i{border-left:3px solid var(--green);}
.slab-qty-item:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-ring);}
.slab-qty-item.need-i:focus-within{border-color:var(--blue);box-shadow:0 0 0 2px rgba(37,99,235,.15);}
.slab-qty-item.can-i:focus-within{border-color:var(--green);box-shadow:0 0 0 2px rgba(21,128,61,.15);}
.sq-step{display:flex;gap:2px;}
.sq-step button{width:24px;height:24px;border:1.5px solid var(--border);background:var(--surface-alt);color:var(--text-sec);border-radius:6px;cursor:pointer;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:'JetBrains Mono',monospace;line-height:1;}
.sq-step button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg);}
.sq-step button:active{transform:scale(.88);}
.slab-note-inline{width:100%;margin-top:8px;}
.slab-note-inline textarea{width:100%;font-size:13px;padding:8px 12px;min-height:34px;background:#fff;border:1.5px solid var(--border);border-radius:8px;resize:vertical;line-height:1.6;}
.slab-note-inline textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-ring);}

@media(max-width:640px){
  .app{padding:16px 14px 30px;}
  .header h1{font-size:22px;}
  .form-grid{grid-template-columns:1fr;}
  .card-body{padding:4px 16px 20px;}
  .card-header{padding:16px;}
  .actions{flex-direction:column;}
  .page-tab{font-size:12px;padding:10px 4px;}
  .history-head{gap:10px;padding:12px 14px;}
  .history-actions{flex-direction:column;}
  .slab-qty-row{gap:6px;}
  .slab-qty-item{padding:5px 8px;}
  .slab-qty-item input[type="number"]{width:36px;font-size:16px;}
}
::-webkit-scrollbar{width:8px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}::-webkit-scrollbar-thumb:hover{background:var(--text-muted);}
</style>

<style id="uacj-theme">
/* ============================================================================
   UACJ THEME v2 "STICKER"  —  Shared visual layer
   REPORT / STOP / QIC / BACKUP
   ----------------------------------------------------------------------------
   แนวทาง: เส้นขอบดำบาง + สีพาสเทล + ไฮไลต์เหลือง + ปุ่มทรงแคปซูล
            ไม่มีเงาหนัก ไม่มี gradient ไม่มี glass

   ชั้นแต่งหน้าอย่างเดียว ไม่มี logic ไม่แตะ markup ของโมดูล
   แก้ไฟล์นี้ไฟล์เดียว → รัน  python3 apply-theme.py  → เปลี่ยนครบทั้ง 4 โมดูล
   โมดูลถูกแยกด้วย  <html data-uacj="report|stop|qic|backup">

   ธีมสีน้ำเงิน UACJ เดิมเก็บไว้ที่ uacj-theme-v1-blue.css
   ========================================================================== */

/* ---------------------------------------------------------------------------
   1. DESIGN TOKENS
   ------------------------------------------------------------------------ */
:root{
  --u-primary:#2FB3A3;          /* เขียวมิ้นต์ — ปุ่มหลัก แท็บที่เลือก */
  --u-primary-hover:#279487;
  --u-primary-deep:#1F8A7D;
  --u-secondary:#5AC8BC;
  --u-light:#E3F5F1;            /* พื้นอ่อนของสีหลัก */

  --u-yellow:#FFDE5C;           /* ไฮไลต์ เน้นคำสำคัญ */
  --u-yellow-deep:#F0C000;
  --u-pink:#F79489;
  --u-pink-tint:#FCE7E3;
  --u-lilac:#A99BE8;
  --u-lilac-tint:#EFEBFB;
  --u-cream:#FFF6DC;

  --u-bg:#FBFBFC;
  --u-white:#FFFFFF;
  --u-ink:#2C2C34;              /* สีเส้นขอบและตัวอักษร */
  --u-text:#2C2C34;
  --u-text-2:#767A85;
  --u-text-3:#A9ADB6;

  --u-success:#2FB3A3;
  --u-warning:#F0B429;
  --u-danger:#F26D63;

  --u-border:var(--u-ink);
  --u-border-card:var(--u-ink);
  --u-border-soft:#E6E8EC;
  --u-line:1.6px;

  --u-tint-primary:var(--u-light);
  --u-ring:rgba(47,179,163,.28);
  --u-tint-success:#E3F5F1;
  --u-tint-warning:#FFF3D6;
  --u-tint-danger:#FCE7E3;

  --u-s1:4px; --u-s2:8px; --u-s3:12px; --u-s4:16px; --u-s5:20px; --u-s6:24px; --u-s7:32px;

  --u-r-input:14px;
  --u-r-btn:999px;              /* ปุ่มหลักเป็นแคปซูล */
  --u-r-card:20px;
  --u-r-chip:999px;
  --u-h-control:48px;

  --u-shadow:none;
  --u-shadow-raise:0 4px 0 var(--u-ink);

  --u-font:'Kanit','IBM Plex Sans Thai','Prompt',system-ui,sans-serif;

  --u-accent:var(--u-primary);
  --u-accent-tint:var(--u-light);
}
/* สีประจำโมดูล — ใช้กับหัวเรื่อง ไอคอน และป้ายชื่อโมดูล */
html[data-uacj="report"]{ --u-accent:#2FB3A3; --u-accent-tint:#E3F5F1; }
html[data-uacj="stop"]  { --u-accent:#F26D63; --u-accent-tint:#FCE7E3; }
html[data-uacj="qic"]   { --u-accent:#F0B429; --u-accent-tint:#FFF3D6; }
html[data-uacj="backup"]{ --u-accent:#8B7BE0; --u-accent-tint:#EFEBFB; }

/* ---------------------------------------------------------------------------
   2. REMAP ตัวแปรเดิมของแต่ละโมดูล → tokens ชุดใหม่
   ------------------------------------------------------------------------ */
html[data-uacj="report"]{
  --bg:var(--u-bg); --surface:var(--u-white); --surface-solid:var(--u-white);
  --raised:var(--u-light); --hover:var(--u-light);
  --border:var(--u-ink); --border-l:var(--u-border-soft);
  --text:var(--u-text); --text2:var(--u-text-2); --muted:var(--u-text-3);
  --accent:var(--u-primary); --accent-s:var(--u-light); --accent-b:var(--u-ink);
  --blue:var(--u-primary);   --blue-s:var(--u-light);   --blue-b:var(--u-ink);
  --red:var(--u-danger);   --red-s:var(--u-tint-danger);   --red-b:var(--u-ink);
  --amber:var(--u-warning);--amber-s:var(--u-tint-warning);--amber-b:var(--u-ink);
  --green:var(--u-success);--green-s:var(--u-tint-success);--green-b:var(--u-ink);
  --cyan:var(--u-lilac);   --cyan-s:var(--u-lilac-tint);   --cyan-b:var(--u-ink);
  --r:var(--u-r-card); --rs:var(--u-r-input);
  --font:var(--u-font); --mono:var(--u-font);
  --shadow:none; --shadow-md:none;
}
html[data-uacj="stop"]{
  --bg:var(--u-bg); --surface:var(--u-white);
  --surface-alt:var(--u-white); --surface-highlight:var(--u-light);
  --accent:var(--u-primary); --accent-hover:var(--u-primary-deep);
  --accent-light:var(--u-light); --accent-glow:var(--u-ring);
  --green:var(--u-success);  --green-light:var(--u-tint-success);
  --cyan:var(--u-lilac);     --cyan-light:var(--u-lilac-tint);
  --danger:var(--u-danger);  --danger-light:var(--u-tint-danger);
  --text:var(--u-text); --text-2:var(--u-text-2); --text-3:var(--u-text-3);
  --border:var(--u-ink); --border-light:var(--u-border-soft);
  --shadow:transparent; --shadow-md:transparent;
  --radius:var(--u-r-card); --radius-sm:var(--u-r-input);
  --font-main:var(--u-font); --font-mono:var(--u-font);
}
html[data-uacj="qic"]{
  --bg:var(--u-bg); --surface:var(--u-white); --surface-alt:var(--u-white);
  --border:var(--u-ink); --border-light:var(--u-border-soft);
  --accent:var(--u-primary); --accent-bg:var(--u-light);
  --accent-hover:var(--u-primary-deep); --accent-ring:var(--u-ring);
  --red:var(--u-danger);   --red-bg:var(--u-tint-danger);
  --green:var(--u-success);--green-bg:var(--u-tint-success);
  --blue:var(--u-lilac);   --blue-bg:var(--u-lilac-tint);
  --text:var(--u-text); --text-sec:var(--u-text-2); --text-muted:var(--u-text-3);
  --shadow-sm:none; --shadow:none;
  --radius:var(--u-r-input); --radius-lg:var(--u-r-card);
}
html[data-uacj="backup"]{
  --white:var(--u-white); --off:var(--u-white);
  --gray:var(--u-border-soft); --gray-2:var(--u-ink);
  --text:var(--u-text); --text-sec:var(--u-text-2); --text-muted:var(--u-text-3);
  --blue:var(--u-primary); --cyan:var(--u-secondary); --violet:var(--u-accent);
  --danger:var(--u-danger); --danger-bg:var(--u-tint-danger);
  --cancel-accent:var(--u-accent); --cancel-bg:var(--u-lilac-tint);
  --success:var(--u-success);
  --shadow-sm:none; --shadow:none; --shadow-lg:none;
  --radius:var(--u-r-card); --radius-md:16px; --radius-sm:var(--u-r-input);
  --gradient:var(--u-primary);
}

/* ---------------------------------------------------------------------------
   3. TYPOGRAPHY
   ------------------------------------------------------------------------ */
body, button, input, select, textarea, optgroup,
h1, h2, h3, h4, h5, h6, p, label, small, strong, th, td{
  font-family:var(--u-font) !important;
}
body{
  background:var(--u-bg) !important;
  color:var(--u-text) !important;
  -webkit-font-smoothing:antialiased;
}
h1{ font-size:25px; font-weight:600; letter-spacing:-.2px; }
h2{ font-size:20px; font-weight:600; }
h3{ font-size:17px; font-weight:500; }
label, .field label, .form-group label, .f-label, .eg label{
  font-size:14px; font-weight:500; color:var(--u-text) !important;
}
small, .hint, .caption, .f-note, .card-sub, .card-title-sub{
  font-size:12.5px; font-weight:300; color:var(--u-text-2) !important;
}

.card-title, .sub-label, .f-label, .sec-title{
  color:var(--u-text) !important;
  font-weight:500 !important;
}
/* ปากกาไฮไลต์เหลืองใต้หัวข้อส่วน — ลายเซ็นของธีมนี้ */
.sec-label{
  color:var(--u-ink) !important;
  font-weight:500 !important;
  letter-spacing:.4px !important;
  font-size:13px !important;
  background-image:linear-gradient(var(--u-yellow),var(--u-yellow)) !important;
  background-repeat:no-repeat !important;
  background-size:100% 7px !important;
  background-position:0 86% !important;
  width:fit-content !important;          /* ให้ไฮไลต์พอดีกับข้อความ ไม่ลากยาวทั้งแถว */
}

/* แถบสรุประยะเวลาใน STOP — เดิมเป็น gradient ทอง */
.dur-bar{
  background:var(--u-yellow) !important;
  color:var(--u-ink) !important;
  box-shadow:none !important;
}
.dur-bar .dur-label{ opacity:.75 !important; }

/* ---------------------------------------------------------------------------
   4. ตัดของตกแต่งที่ไม่ได้ทำหน้าที่ (orb / noise / glow / glass)
   ------------------------------------------------------------------------ */
.bg-anim, .ambient, .orb{ display:none !important; }
html[data-uacj="stop"] body::before,
html[data-uacj="stop"] body::after{ display:none !important; content:none !important; }
.card::before, .type-btn::before, .hdr-icon::after, .sec-label::after,
.btn-primary::before, .card-ico::after{ display:none !important; }
*{ backdrop-filter:none !important; -webkit-backdrop-filter:none !important; }

/* ---------------------------------------------------------------------------
   5. CARD — ขาว ขอบดำบาง มุมมน ไม่มีเงา
   ------------------------------------------------------------------------ */
@keyframes uacjRise{
  from{ opacity:0; transform:translateY(12px); }
  to  { opacity:1; transform:none; }
}
@keyframes uacjPop{
  0%{ transform:scale(.92); } 60%{ transform:scale(1.05); } 100%{ transform:scale(1); }
}

.card, .pv, .panel, .preview-card, .hist-card, .h-item, .entry,
.qic-entry, .history-item, .modal-box, .bs-sheet, .sp-body{
  background:var(--u-white) !important;
  border:var(--u-line) solid var(--u-ink) !important;
  border-radius:var(--u-r-card) !important;
  box-shadow:none !important;
}
.card{
  margin-bottom:var(--u-s4) !important;
  animation:uacjRise .42s cubic-bezier(.22,1,.36,1) both !important;
}
.card:hover{ transform:none !important; }
.entry, .qic-entry, .h-item, .history-item{ border-radius:16px !important; }
/* การ์ดซ้อนในการ์ด ใช้พื้นพาสเทลแทน เพื่อไม่ให้ขอบดำซ้อนกันจนลายตา */
.card .entry, .card .qic-entry, .card .sub-sec{
  background:var(--u-accent-tint) !important;
  border-color:var(--u-ink) !important;
}

/* ---------------------------------------------------------------------------
   6. BUTTON — แคปซูล ขอบดำ มีเงาทึบ กดแล้วยุบลง
   ------------------------------------------------------------------------ */
button{ font-family:var(--u-font) !important; letter-spacing:0 !important; }
.btn, .btn-primary, .btn-secondary, .btn-gen, .btn-sp,
.modal-btn, .add-btn, .suggest-btn, .btn-add, .btn-load, .btn-clr, .h-clear{
  font-family:var(--u-font) !important;
  font-size:15px !important;
  font-weight:500 !important;
  border-radius:var(--u-r-btn) !important;
  letter-spacing:0 !important;
  transition:transform .12s ease, background .16s ease, box-shadow .12s ease !important;
}
.btn, .btn-primary, .btn-gen, .btn-sp, .modal-btn{
  min-height:var(--u-h-control) !important;
  background:var(--u-primary) !important;
  color:var(--u-white) !important;
  border:var(--u-line) solid var(--u-ink) !important;
  box-shadow:0 3px 0 var(--u-ink) !important;
  transform:none !important;
}
.btn:hover, .btn-primary:hover, .btn-gen:hover, .btn-sp:hover, .modal-btn:hover{
  background:var(--u-primary-deep) !important;
  transform:none !important;
  box-shadow:0 3px 0 var(--u-ink) !important;
}
.btn:active, .btn-primary:active, .btn-gen:active, .btn-sp:active, .modal-btn:active{
  transform:translateY(3px) !important;
  box-shadow:0 0 0 var(--u-ink) !important;
}
.btn.done, .btn-primary.done{
  background:var(--u-yellow) !important;
  color:var(--u-ink) !important;
  animation:uacjPop .3s ease !important;
}
.btn-secondary, .btn-add, .btn-load, .add-btn, .suggest-btn, .h-copy-btn{
  background:var(--u-white) !important;
  color:var(--u-ink) !important;
  border:var(--u-line) dashed var(--u-ink) !important;
  box-shadow:none !important;
  min-height:42px !important;
}
.btn-secondary:hover, .btn-add:hover, .btn-load:hover, .add-btn:hover, .suggest-btn:hover{
  background:var(--u-light) !important;
  border-style:solid !important;
  transform:none !important;
}
.btn.btn-ghost, .btn.btn-secondary, .btn.btn-load{
  background:var(--u-white) !important;
  color:var(--u-text-2) !important;
  border:var(--u-line) dashed var(--u-ink) !important;
  box-shadow:none !important;
}
.btn.btn-ghost:active{ transform:translateY(2px) !important; }
.btn.btn-ghost:hover{
  background:var(--u-tint-danger) !important;
  color:var(--u-danger) !important;
  border-style:solid !important;
}
.btn-sm{ min-height:42px !important; font-size:14px !important; }
.btn-rm, .btn-del, .btn-del-h, .btn-clr, .h-clear, .h-del, .entry-x, .cst-clear{
  color:var(--u-danger) !important;
  background:var(--u-white) !important;
  border:1.4px solid var(--u-ink) !important;
  border-radius:999px !important;
  box-shadow:none !important;
}
.btn-rm:hover, .btn-del:hover, .btn-del-h:hover, .btn-clr:hover, .h-clear:hover,
.h-del:hover, .entry-x:hover{
  background:var(--u-tint-danger) !important;
  color:var(--u-danger) !important;
}
button:disabled, .btn:disabled{
  background:var(--u-border-soft) !important;
  border-color:var(--u-text-3) !important;
  color:var(--u-text-3) !important;
  box-shadow:none !important;
  cursor:not-allowed !important;
}

/* ---------------------------------------------------------------------------
   7. INPUT — ขาว ขอบดำบาง โฟกัสแล้วมีวงเขียว
   ------------------------------------------------------------------------ */
input[type="text"], input[type="date"], input[type="time"], input[type="number"],
input[type="tel"], select, textarea,
.inp-date, .inp-time, .inp-text, .inp-num, .inp-area, .f-input, .f-textarea{
  font-family:var(--u-font) !important;
  font-size:15px !important;
  font-weight:400 !important;
  letter-spacing:0 !important;
  color:var(--u-text) !important;
  background:var(--u-white) !important;
  border:var(--u-line) solid var(--u-ink) !important;
  border-radius:var(--u-r-input) !important;
  box-shadow:none !important;
  transition:box-shadow .16s ease !important;
}
input[type="text"], input[type="date"], input[type="time"], input[type="number"],
input[type="tel"], select{
  min-height:var(--u-h-control) !important;
  padding:10px 15px !important;
}
textarea, .inp-area, .f-textarea{ padding:12px 15px !important; line-height:1.75 !important; }
input:focus, select:focus, textarea:focus,
.inp-date:focus, .inp-time:focus, .inp-text:focus, .inp-num:focus, .inp-area:focus,
.f-input:focus, .f-textarea:focus{
  border-color:var(--u-ink) !important;
  box-shadow:0 0 0 4px var(--u-ring) !important;
  background:var(--u-white) !important;
  outline:none !important;
}
::placeholder{ color:var(--u-text-3) !important; font-weight:300 !important; }
input.invalid{ border-color:var(--u-danger) !important; box-shadow:0 0 0 4px rgba(242,109,99,.22) !important; }
input.valid  { box-shadow:0 0 0 4px var(--u-ring) !important; }
.summary-num, .nr-result, .dur-val, .qi-text{ font-weight:600 !important; color:var(--u-ink) !important; }

/* ---------------------------------------------------------------------------
   8. CHIP / TOGGLE — แคปซูล เลือกแล้วเด้ง
   ------------------------------------------------------------------------ */
.chip, .nr-tag, .cascade-btn, .type-btn, .chip-pos, .bs-option{
  font-family:var(--u-font) !important;
  font-size:13px !important;
  font-weight:400 !important;
  border-radius:999px !important;
  padding:7px 14px !important;
  box-shadow:none !important;
  transition:transform .14s ease, background .16s ease !important;
}
.chip, .chip-pos{
  background:var(--u-white) !important;
  color:var(--u-text-2) !important;
  border:1.4px solid var(--u-ink) !important;
}
.chip:active, .nr-tag:active, .cascade-btn:active{ transform:scale(.95) !important; }
.chip.active, .chip.chip-sel, .chip-pos.active, .bs-option.bs-selected,
.cascade-btn.cascade-active{
  background:var(--u-primary) !important;
  border-color:var(--u-ink) !important;
  color:var(--u-white) !important;
  font-weight:500 !important;
  box-shadow:none !important;
  animation:uacjPop .28s ease !important;
}
.toggle-track, .toggle::after, .sw, .switch{ box-shadow:none !important; }
.toggle-track, .switch, .sw{ border:1.4px solid var(--u-ink) !important; }
.toggle-wrap input:checked + .toggle-track,
.toggle input:checked + .toggle-track{ background:var(--u-primary) !important; }

/* ---------------------------------------------------------------------------
   9. HEADER — การ์ดพาสเทลขอบดำ สีตามโมดูล
   ------------------------------------------------------------------------ */
.header, .hdr, .hero{
  opacity:1 !important;
  background:var(--u-accent-tint) !important;
  border:var(--u-line) solid var(--u-ink) !important;
  border-radius:var(--u-r-card) !important;
  box-shadow:none !important;
  text-align:left !important;
  padding:var(--u-s5) !important;
  margin-bottom:var(--u-s4) !important;
  animation:uacjRise .45s cubic-bezier(.22,1,.36,1) both !important;
}
.hero h1{ background:none !important; -webkit-text-fill-color:var(--u-ink) !important; }
.header h1, .hdr h1, .hero h1{
  font-size:22px !important; font-weight:600 !important;
  color:var(--u-ink) !important; margin:0 !important; letter-spacing:-.2px !important;
}
.header p, .hdr p, .hero p{
  font-size:13px !important; font-weight:300 !important;
  color:var(--u-text-2) !important; margin:4px 0 0 !important;
}
.hdr-icon, .header-badge{
  width:48px !important; height:48px !important; min-width:48px !important;
  background:var(--u-white) !important;
  border:var(--u-line) solid var(--u-ink) !important;
  border-radius:16px !important;
  font-size:22px !important;
  box-shadow:0 3px 0 var(--u-ink) !important;
  transform:none !important;
  margin:0 0 var(--u-s3) !important;
  display:inline-flex !important; align-items:center !important; justify-content:center !important;
}
.hdr-icon:hover{ transform:none !important; }
.sticky-top{ background:var(--u-bg) !important; box-shadow:none !important; border:0 !important; }
.hero-badge{
  background:var(--u-white) !important;
  border:1.4px solid var(--u-ink) !important;
  color:var(--u-ink) !important;
  font-size:12px !important; font-weight:500 !important;
  border-radius:999px !important; padding:4px 12px !important;
  margin-bottom:var(--u-s3) !important;
}

/* ---------------------------------------------------------------------------
   10. TAB
   ------------------------------------------------------------------------ */
.tabs, .page-tabs, .tab-bar{
  background:var(--u-white) !important;
  border:var(--u-line) solid var(--u-ink) !important;
  border-radius:999px !important;
  padding:var(--u-s1) !important;
  box-shadow:none !important;
  gap:var(--u-s1) !important;
  animation:none !important;
}
.tab, .tab-btn, .page-tab{
  font-family:var(--u-font) !important;
  font-size:13.5px !important;
  font-weight:500 !important;
  color:var(--u-text-2) !important;
  background:transparent !important;
  border:0 !important;
  border-radius:999px !important;
  min-height:38px !important;
  padding:8px 12px !important;
  box-shadow:none !important;
  transition:background .18s ease, color .18s ease !important;
}
.tab.active, .tab-btn.active, .page-tab.active,
.tab[data-tab="normal"].active{
  background:var(--u-primary) !important;
  color:var(--u-white) !important;
  box-shadow:none !important;
}
.tab-btn:not(.active):hover, .page-tab:hover:not(.active), .tab:not(.active):hover{
  background:var(--u-light) !important;
  color:var(--u-ink) !important;
}
/* REPORT ใช้แถบแท็บแบบเลื่อนแนวนอน — คงโครงเดิม */
html[data-uacj="report"] .tabs{
  background:transparent !important; border:0 !important;
  padding:0 var(--u-s1) var(--u-s3) !important;
}
html[data-uacj="report"] .tab{
  background:var(--u-white) !important;
  border:1.4px solid var(--u-ink) !important;
  min-height:34px !important; padding:6px 14px !important; font-size:13px !important;
}
html[data-uacj="report"] .tab.active,
html[data-uacj="report"] .tab[data-tab="normal"].active{
  background:var(--u-primary) !important; color:var(--u-white) !important;
}

/* ---------------------------------------------------------------------------
   11. STATUS / BADGE
   ------------------------------------------------------------------------ */
.badge-normal, .pv-tag, .preview-badge, .tab-badge, .badge-c, .hdr-badge,
.entry-tag, .hero-dot, .sp-badge{
  font-family:var(--u-font) !important;
  font-size:12px !important; font-weight:500 !important;
  border-radius:999px !important; letter-spacing:0 !important; box-shadow:none !important;
}
.pv-tag, .preview-badge, .sp-badge{
  background:var(--u-yellow) !important;
  color:var(--u-ink) !important;
  border:1.4px solid var(--u-ink) !important;
  padding:3px 11px !important;
}
.badge-c, .tab-badge, .hdr-badge{
  background:var(--u-pink) !important; color:var(--u-white) !important;
  border:1.4px solid var(--u-ink) !important;
}
.time-dot.on, .hero-dot{ background:var(--u-primary) !important; box-shadow:none !important; animation:none !important; }
.qic-entry-head .h-title, .entry-top .entry-tag{ font-size:14px !important; }
.step-num, .nr-step-num{
  min-width:28px !important; height:28px !important; font-size:13px !important;
  background:var(--u-yellow) !important;
  color:var(--u-ink) !important;
  border:1.4px solid var(--u-ink) !important;
  border-radius:999px !important;
  font-weight:600 !important; box-shadow:none !important;
}

/* ---------------------------------------------------------------------------
   12. PREVIEW — กล่องข้อความที่จะ copy เข้า Line
   ------------------------------------------------------------------------ */
.pv-msg, .pv-text, .preview-box, .p-code, .h-pre, .hist-preview, .history-preview{
  font-family:var(--u-font) !important;
  font-size:14.5px !important; font-weight:400 !important;
  line-height:1.9 !important;
  color:var(--u-ink) !important;
  background:var(--u-cream) !important;
  border:1.4px dashed var(--u-ink) !important;
  border-radius:16px !important;
  white-space:pre-wrap !important;
}
.pv-head, .preview-header, .card-header, .card-head, .hist-hd, .h-row{
  background:transparent !important;
  border-bottom:1.4px solid var(--u-border-soft) !important;
}

/* ---------------------------------------------------------------------------
   13. TABLE
   ------------------------------------------------------------------------ */
table{ width:100%; border-collapse:separate; border-spacing:0; font-size:14px;
  border:var(--u-line) solid var(--u-ink); border-radius:16px; overflow:hidden; }
th{
  background:var(--u-light) !important; color:var(--u-ink) !important;
  font-weight:500 !important; text-align:left;
  padding:11px 14px !important; border-bottom:1.4px solid var(--u-ink) !important;
}
td{
  background:var(--u-white) !important; padding:11px 14px !important;
  border-bottom:1px solid var(--u-border-soft) !important;
}
tbody tr:hover td{ background:var(--u-light) !important; }

/* ---------------------------------------------------------------------------
   14. TOAST / MODAL
   ------------------------------------------------------------------------ */
.toast{
  font-family:var(--u-font) !important;
  font-size:14px !important; font-weight:500 !important;
  background:var(--u-ink) !important; color:var(--u-white) !important;
  border:0 !important; border-radius:999px !important;
  box-shadow:0 4px 0 rgba(44,44,52,.25) !important;
  padding:13px 24px !important;
}
.modal-overlay, .bs-overlay, .sp-bg{ background:rgba(44,44,52,.42) !important; }
.modal-icon{ box-shadow:none !important; }

/* ---------------------------------------------------------------------------
   15. LAYOUT
   ------------------------------------------------------------------------ */
.app, .main{
  max-width:520px !important; margin:0 auto !important;
  padding:14px 12px 40px !important;      /* บีบขอบนอก เพื่อให้การ์ดข้างในกว้างขึ้น */
}
.foot, .h-footer{ color:var(--u-text-3) !important; font-size:12px !important; animation:none !important; }
.tab-panel.active, .sec.active, .panel{ animation:none !important; }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.001s !important; transition-duration:.001s !important; }
}


/* ===========================================================================
   16. PADDING ของการ์ด — แยกตามโครงเดิมของแต่ละโมดูล
   ---------------------------------------------------------------------------
   report กับ qic ใส่ padding ไว้ที่ .card-body/.card-head อยู่แล้ว
   ถ้าไปใส่ที่ .card อีกชั้นจะกลายเป็น padding ซ้อนกัน ทำให้เนื้อหาถูกบีบ
   ========================================================================= */
html[data-uacj="stop"]   .card{ padding:20px 18px !important; }
html[data-uacj="backup"] .card{ padding:22px 20px !important; }

html[data-uacj="report"] .card{ padding:0 !important; }
html[data-uacj="report"] .card-head{ padding:18px 20px 0 !important; gap:10px !important; }
html[data-uacj="report"] .card-body{ padding:16px 20px 22px !important; }

html[data-uacj="qic"] .card{ padding:0 !important; }
html[data-uacj="qic"] .card-header{ padding:18px 20px !important; }
/* เว้น padding บน-ล่างไว้ให้โมดูลจัดการเอง ไม่งั้นตอนพับการ์ดจะเหลือช่องว่างค้าง */
html[data-uacj="qic"] .card-body{ padding-left:20px !important; padding-right:20px !important; }

/* ===========================================================================
   17. REPORT — ป๊อปอัปเลือกค่า ย้ายมากลางจอ
   ---------------------------------------------------------------------------
   เดิมเป็น bottom sheet ติดขอบล่าง พอรันในแอปรวมจะโดนแถบเมนูล่างทับ
   จนกดตัวเลือกล่างสุดไม่ได้ จึงเปลี่ยนเป็นกล่องกลางจอ
   ========================================================================= */
@keyframes uacjSheetIn{
  from{ opacity:0; transform:translate(-50%,-46%) scale(.94); }
  to  { opacity:1; transform:translate(-50%,-50%) scale(1); }
}
@keyframes uacjSheetOut{
  from{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  to  { opacity:0; transform:translate(-50%,-48%) scale(.96); }
}
html[data-uacj="report"] .bs-sheet{
  top:50% !important; bottom:auto !important; left:50% !important;
  width:min(92vw,410px) !important;
  max-height:76vh !important;
  padding:24px 20px !important;
  background:var(--u-white) !important;
  border:var(--u-line) solid var(--u-ink) !important;
  border-radius:24px !important;
  box-shadow:0 5px 0 var(--u-ink) !important;
  transform:translate(-50%,-50%) scale(.94) !important;
}
html[data-uacj="report"] .bs-sheet.bs-show{
  animation:uacjSheetIn .26s cubic-bezier(.22,1,.36,1) forwards !important;
}
html[data-uacj="report"] .bs-sheet.bs-dismiss{
  animation:uacjSheetOut .18s ease forwards !important;
}
html[data-uacj="report"] .bs-handle{ display:none !important; }
html[data-uacj="report"] .bs-title{
  font-size:15px !important; font-weight:600 !important;
  color:var(--u-ink) !important;
  text-transform:none !important; letter-spacing:0 !important;
  margin-bottom:18px !important;
}
html[data-uacj="report"] .bs-options{ gap:10px !important; padding-bottom:0 !important; }
html[data-uacj="report"] .bs-option{
  min-height:54px !important;
  padding:15px 18px !important;
  font-size:15px !important;
  border-radius:999px !important;
  border:1.4px solid var(--u-ink) !important;
  background:var(--u-white) !important;
  color:var(--u-ink) !important;
  box-shadow:none !important;
}
html[data-uacj="report"] .bs-option:hover{
  background:var(--u-light) !important; transform:none !important; box-shadow:none !important;
}
html[data-uacj="report"] .bs-option.bs-selected{
  background:var(--u-primary) !important; border-color:var(--u-ink) !important;
  color:var(--u-white) !important; box-shadow:none !important;
}

/* ===========================================================================
   18. REPORT — ช่องกรอกงานเสีย (Scrap / Cancel / QIC)
   ---------------------------------------------------------------------------
   เดิมเรียง Alloy / Lot / รายละเอียด ไว้ในบรรทัดเดียว บนมือถือจะแคบจนพิมพ์ไม่ได้
   เปลี่ยนเป็นเรียงลงมาทีละช่อง และขยายความสูงให้นิ้วกดได้
   ========================================================================= */
html[data-uacj="report"] .nr-waste-row{
  grid-template-columns:1fr !important;
  gap:10px !important;
  padding:14px !important;
  border-radius:16px !important;
  background:var(--u-white) !important;
  border:1.4px solid var(--u-ink) !important;
}
html[data-uacj="report"] .nr-waste-rows{ gap:10px !important; }
html[data-uacj="report"] .nr-waste-row .w-idx{
  justify-self:start !important;
  min-width:28px !important; height:28px !important;
  background:var(--u-yellow) !important;
  color:var(--u-ink) !important;
  border:1.4px solid var(--u-ink) !important;
  font-size:12px !important;
}
html[data-uacj="report"] .nr-waste-row input,
html[data-uacj="report"] .status-item input{
  width:100% !important;
  min-height:46px !important;
  font-size:15px !important;
  font-family:var(--u-font) !important;
  padding:11px 14px !important;
  border-radius:12px !important;
  border:1.4px solid var(--u-ink) !important;
  background:var(--u-white) !important;
}
/* กล่อง QIC สร้างด้วย inline style จาก JS — ต้องใช้ !important ถึงจะทับได้ */
html[data-uacj="report"] .status-item{
  padding:14px !important;
  border-radius:16px !important;
  margin-bottom:10px !important;
  background:var(--u-white) !important;

<script>
function $(id){return document.getElementById(id);}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function pad(n){return n<10?'0'+n:''+n;}
function showToast(m){var t=$('to');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2800);}
function doClip(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){showToast('✓ Copy สำเร็จ! บันทึกประวัติแล้ว');});
  }else{
    var a=document.createElement('textarea');a.value=txt;a.style.position='fixed';a.style.opacity='0';
    document.body.appendChild(a);a.select();document.execCommand('copy');document.body.removeChild(a);
    showToast('✓ Copy สำเร็จ! บันทึกประวัติแล้ว');
  }
}

/* SCRAP MODAL */
var scrapModalDone=false;
function showScrapModal(cb){
  var m=$('scrapModal');
  m.classList.add('show');
  scrapModalDone=false;
  var handler=function(){
    if(!scrapModalDone){
      scrapModalDone=true;
      m.classList.remove('show');
      m.removeEventListener('click',handler);
      if(cb)cb();
    }
  };
  m.querySelector('.btn').onclick=function(){
    if(!scrapModalDone){
      scrapModalDone=true;
      m.classList.remove('show');
      if(cb)cb();
    }
  };
  m.addEventListener('click',function(e){
    if(e.target===m)handler();
  });
}
function closeScrapModal(){
  $('scrapModal').classList.remove('show');
}

document.querySelectorAll('.st').forEach(function(t){
  t.addEventListener('change',function(){
    var card=t.closest('.card');
    if(card)card.classList.toggle('collapsed',!t.checked);
  });
});

function qTab(btn,id){
  var pg=btn.closest('.app');
  pg.querySelectorAll('.page-tab').forEach(function(t){t.classList.remove('active');});
  btn.classList.add('active');
  pg.querySelectorAll('.sec').forEach(function(s){s.classList.remove('active');});
  document.getElementById(id).classList.add('active');
  if(id==='qp')qRenderPreview();
  if(id==='qh')qRenderHistory();
}

var ENMO=['January','February','March','April','May','June','July','August','September','October','November','December'];
var QPLATES=[100,200,300,400,500,600,700,800];
var QDEFECTS=[
  {key:'oil',label:'รอยน้ำมันหยด'},
  {key:'crack',label:'รอยแตก'},
  {key:'dent',label:'รอยกดทับ'},
  {key:'shortSlab',label:'Slab สั้น'},
  {key:'debris',label:'รอยเศษใต้แผ่น'},
  {key:'custom',label:'✏️ พิมพ์เอง'}
];

var QHK='qic_lin';
var qNextId=0;
var qEntries=[];

function qNewEntry(){
  return{id:++qNextId,status:'',alloy:'',lot:'',plates:[],defectType:'',defectCustom:'',position:'',crackSide:'',crackDist:'',dentSide:'',dentDist:'',slabLen:'',slabThick:'',slabNeed:'',slabCanCut:'',slabNote:''};
}

qEntries.push(qNewEntry());
$('qD').value=new Date().toISOString().split('T')[0];

function qRenderEntries(){
  var c=$('qE');
  c.innerHTML='';

  qEntries.forEach(function(e,idx){
    var div=document.createElement('div');
    div.className='qic-entry';
    var pa=e.plates||[];

    var sub='';
    if(e.defectType==='crack'){
      var wsC=e.crackSide==='ws'?' active':'';
      var dsC=e.crackSide==='ds'?' active':'';
      sub='<div class="defect-sub">'
        +'<label>รอยแตก — เลือกฝั่ง</label>'
        +'<div class="chip-row" style="margin-bottom:10px">'
        +'<button class="chip chip-sm q-cs'+wsC+'" data-eid="'+e.id+'" data-side="ws">WS</button>'
        +'<button class="chip chip-sm q-cs'+dsC+'" data-eid="'+e.id+'" data-side="ds">DS</button>'
        +'</div>'
        +'<div class="form-grid"><div class="form-group"><label>ระยะจากฝั่ง (mm.)</label>'
        +'<input type="number" class="q-cd" data-eid="'+e.id+'" value="'+esc(e.crackDist)+'" placeholder="เช่น 150" min="0">'
        +'</div></div></div>';
    }
    else if(e.defectType==='dent'){
      var dwsC=e.dentSide==='ws'?' active':'';
      var ddsC=e.dentSide==='ds'?' active':'';
      sub='<div class="defect-sub">'
        +'<label>รอยกดทับ — เลือกฝั่ง</label>'
        +'<div class="chip-row" style="margin-bottom:10px">'
        +'<button class="chip chip-sm q-ds'+dwsC+'" data-eid="'+e.id+'" data-side="ws">WS</button>'
        +'<button class="chip chip-sm q-ds'+ddsC+'" data-eid="'+e.id+'" data-side="ds">DS</button>'
        +'</div>'
        +'<div class="form-grid"><div class="form-group"><label>จากระยะฝั่ง (mm.)</label>'
        +'<input type="number" class="q-dd" data-eid="'+e.id+'" value="'+esc(e.dentDist)+'" placeholder="เช่น 200" min="0">'
        +'</div></div></div>';
    }
    else if(e.defectType==='shortSlab'){
      sub='<div class="defect-sub">'
        +'<label>Slab สั้น</label>'
        +'<div class="form-grid">'
        +'<div class="form-group"><label>ความยาวติดลบ (mm.)</label>'
        +'<input type="number" class="q-sl" data-eid="'+e.id+'" value="'+esc(e.slabLen)+'" placeholder="เช่น 50" min="0"></div>'
        +'<div class="form-group"><label>ความหนาติดลบ (mm.)</label>'
        +'<input type="number" class="q-st2" data-eid="'+e.id+'" value="'+esc(e.slabThick)+'" placeholder="เช่น 10" min="0"></div>'
        +'</div>'

        +'<div class="slab-qty-row">'
          +'<span class="sq-label">📦 ตัด:</span>'
          +'<div class="slab-qty-item need-i">'
            +'<span class="qi-icon">📋</span>'
            +'<span class="qi-text">ต้องการ</span>'
            +'<input type="number" class="q-sln" data-eid="'+e.id+'" value="'+esc(e.slabNeed)+'" placeholder="0" min="0" max="99">'
            +'<span class="qi-unit">แผ่น</span>'
            +'<div class="sq-step">'
              +'<button class="q-sln-d" data-eid="'+e.id+'">−</button>'
              +'<button class="q-sln-u" data-eid="'+e.id+'">+</button>'
            +'</div>'
          +'</div>'
          +'<div class="slab-qty-item can-i">'
            +'<span class="qi-icon">✂️</span>'
            +'<span class="qi-text">ตัดได้</span>'
            +'<input type="number" class="q-slc" data-eid="'+e.id+'" value="'+esc(e.slabCanCut)+'" placeholder="0" min="0" max="99">'
            +'<span class="qi-unit">แผ่น</span>'
            +'<div class="sq-step">'
              +'<button class="q-slc-d" data-eid="'+e.id+'">−</button>'
              +'<button class="q-slc-u" data-eid="'+e.id+'">+</button>'
            +'</div>'
          +'</div>'
        +'</div>'

        +'<div class="slab-note-inline">'
          +'<textarea class="q-slb-note" data-eid="'+e.id+'" placeholder="หมายเหตุ...">'+esc(e.slabNote||'')+'</textarea>'
        +'</div>'

        +'</div>';
    }
    else if(e.defectType==='custom'){
      sub='<div class="defect-sub">'
        +'<div class="form-grid"><div class="form-group"><label>ระบุ Defect</label>'
        +'<input type="text" class="q-dc" data-eid="'+e.id+'" value="'+esc(e.defectCustom)+'" placeholder="พิมพ์ชื่อ defect...">'
        +'</div></div></div>';
    }

    var plateChips='';
    QPLATES.forEach(function(v){
      var cls=pa.indexOf(v)>=0?' active':'';
      plateChips+='<button class="chip chip-sm q-pl'+cls+'" data-eid="'+e.id+'" data-v="'+v+'">'+v+'</button>';
    });
    var plateDisp=pa.length>0?'<div class="plate-sel">เลือกแล้ว: '+pa.join(', ')+'</div>':'';

    var defectChips='';
    QDEFECTS.forEach(function(dt){
      var cls=e.defectType===dt.key?' active':'';
      defectChips+='<button class="chip chip-sm q-df'+cls+'" data-eid="'+e.id+'" data-v="'+dt.key+'">'+dt.label+'</button>';
    });

    var posT=e.position==='top'?' active':'';
    var posB=e.position==='bottom'?' active':'';
    var posW=e.position==='ws'?' active':'';
    var posD=e.position==='ds'?' active':'';
    var rmBtn=qEntries.length>1?'<button class="btn-rm q-rm" data-eid="'+e.id+'">&times;</button>':'<div style="width:36px"></div>';

    div.innerHTML=''
      +'<div class="qic-entry-head">'
        +'<span class="step-num">'+(idx+1)+'</span>'
        +'<span class="h-title">รายการที่ '+(idx+1)+'</span>'
        +'<div style="flex:1"></div>'+rmBtn
      +'</div>'
      +'<div class="form-grid">'
      +'<div class="form-group full"><label>สถานะ</label>'
        +'<div class="chip-row q-sta" data-eid="'+e.id+'">'
          +'<button class="chip chip-sm'+(e.status==='qic'?' active':'')+'" data-v="qic">QIC แจ้งคุณภาพ</button>'
          +'<button class="chip chip-sm'+(e.status==='scrap'?' active':'')+'" data-v="scrap">SCRAP</button>'
        +'</div></div>'
      +'<div class="form-group"><label>Alloy</label>'
        +'<input type="text" class="q-al" data-eid="'+e.id+'" value="'+esc(e.alloy)+'" placeholder="Alloy"></div>'
      +'<div class="form-group"><label>Lot no.</label>'
        +'<input type="text" class="q-lo" data-eid="'+e.id+'" value="'+esc(e.lot)+'" placeholder="Lot No." inputmode="numeric" pattern="[0-9]*"></div>'
      +'<div class="form-group full"><label>แผ่นที่ <span style="font-size:12px;color:var(--text-muted);font-weight:400">(เลือกได้หลายแผ่น)</span></label>'
        +'<div class="chip-row q-plr" data-eid="'+e.id+'">'+plateChips+'</div>'+plateDisp+'</div>'
      +'<div class="form-group full"><label>Defect Detail</label>'
        +'<div class="chip-row q-dfr" data-eid="'+e.id+'">'+defectChips+'</div>'+sub+'</div>'
      +'<div class="form-group full"><label>Position</label>'
        +'<div class="chip-row q-por" data-eid="'+e.id+'">'
          +'<button class="chip chip-sm chip-pos'+posT+'" data-v="top">TOP</button>'
          +'<button class="chip chip-sm chip-pos'+posB+'" data-v="bottom">BOTTOM</button>'
          +'<button class="chip chip-sm chip-pos'+posW+'" data-v="ws">WS</button>'
          +'<button class="chip chip-sm chip-pos'+posD+'" data-v="ds">DS</button>'
        +'</div></div>'
      +'</div>';
    c.appendChild(div);
  });

  var box=$('qE');

  box.querySelectorAll('.q-sta').forEach(function(row){
    var eid=parseInt(row.getAttribute('data-eid'));
    row.querySelectorAll('.chip').forEach(function(ch){
      ch.addEventListener('click',function(){
        var ent=qEntries.find(function(x){return x.id===eid;});
        if(ent){ent.status=ch.getAttribute('data-v');qRenderEntries();}
      });
    });
  });

  box.querySelectorAll('.q-al').forEach(function(inp){
    inp.addEventListener('input',function(){
      var ent=qEntries.find(function(x){return x.id===parseInt(inp.getAttribute('data-eid'));});
      if(ent)ent.alloy=inp.value;
    });
  });

  /* Lot no. — numbers only */
  box.querySelectorAll('.q-lo').forEach(function(inp){
    inp.addEventListener('input',function(){
      this.value=this.value.replace(/[^0-9]/g,'');
      var ent=qEntries.find(function(x){return x.id===parseInt(inp.getAttribute('data-eid'));});
      if(ent)ent.lot=inp.value;
    });
  });

  box.querySelectorAll('.q-plr').forEach(function(row){
    var eid=parseInt(row.getAttribute('data-eid'));
    row.querySelectorAll('.chip').forEach(function(ch){
      ch.addEventListener('click',function(){
        var ent=qEntries.find(function(x){return x.id===eid;});
        if(!ent)return;
        var v=parseInt(ch.getAttribute('data-v'));
        var i=ent.plates.indexOf(v);
        if(i>=0)ent.plates.splice(i,1);
        else{ent.plates.push(v);ent.plates.sort(function(a,b){return a-b;});}
        qRenderEntries();
      });
    });
  });

  box.querySelectorAll('.q-dfr').forEach(function(row){
    var eid=parseInt(row.getAttribute('data-eid'));
    row.querySelectorAll('.chip').forEach(function(ch){
      ch.addEventListener('click',function(){
        var ent=qEntries.find(function(x){return x.id===eid;});
        if(!ent)return;
        var val=ch.getAttribute('data-v');
        ent.defectType=val;
        if(val!=='crack'){ent.crackSide='';ent.crackDist='';}
        if(val!=='dent'){ent.dentSide='';ent.dentDist='';}
        if(val!=='shortSlab'){ent.slabLen='';ent.slabThick='';ent.slabNeed='';ent.slabCanCut='';ent.slabNote='';}
        if(val!=='custom')ent.defectCustom='';
        qRenderEntries();
      });
    });
  });

  box.querySelectorAll('.q-por').forEach(function(row){
    var eid=parseInt(row.getAttribute('data-eid'));
    row.querySelectorAll('.chip').forEach(function(ch){
      ch.addEventListener('click',function(){
        var ent=qEntries.find(function(x){return x.id===eid;});
        if(ent){ent.position=ent.position===ch.getAttribute('data-v')?'':ch.getAttribute('data-v');qRenderEntries();}
      });
    });
  });

  box.querySelectorAll('.q-cs').forEach(function(ch){
    ch.addEventListener('click',function(){
      var eid=parseInt(ch.getAttribute('data-eid'));
      var side=ch.getAttribute('data-side');
      var ent=qEntries.find(function(x){return x.id===eid;});
      if(ent){ent.crackSide=ent.crackSide===side?'':side;qRenderEntries();}
    });
  });

  box.querySelectorAll('.q-cd').forEach(function(inp){
    inp.addEventListener('input',function(){
      var ent=qEntries.find(function(x){return x.id===parseInt(inp.getAttribute('data-eid'));});
      if(ent)ent.crackDist=inp.value;
    });
  });

  /* Dent side */
  box.querySelectorAll('.q-ds').forEach(function(ch){
    ch.addEventListener('click',function(){
      var eid=parseInt(ch.getAttribute('data-eid'));
      var side=ch.getAttribute('data-side');
      var ent=qEntries.find(function(x){return x.id===eid;});
      if(ent){ent.dentSide=ent.dentSide===side?'':side;qRenderEntries();}
    });
  });

  /* Dent distance */
  box.querySelectorAll('.q-dd').forEach(function(inp){
    inp.addEventListener('input',function(){
      var ent=qEntries.find(function(x){return x.id===parseInt(inp.getAttribute('data-eid'));});
      if(ent)ent.dentDist=inp.value;
    });
  });

  box.querySelectorAll('.q-sl').forEach(function(inp){
    inp.addEventListener('input',function(){
      var ent=qEntries.find(function(x){return x.id===parseInt(inp.getAttribute('data-eid'));});
      if(ent)ent.slabLen=inp.value;
    });
  });

  box.querySelectorAll('.q-st2').forEach(function(inp){
    inp.addEventListener('input',function(){
      var ent=qEntries.find(function(x){return x.id===parseInt(inp.getAttribute('data-eid'));});
      if(ent)ent.slabThick=inp.value;
    });
  });

  box.querySelectorAll('.q-sln').forEach(function(inp){
    inp.addEventListener('input',function(){
      var ent=qEntries.find(function(x){return x.id===parseInt(inp.getAttribute('data-eid'));});
      if(ent)ent.slabNeed=inp.value;
    });
  });

  box.querySelectorAll('.q-slc').forEach(function(inp){
    inp.addEventListener('input',function(){
      var ent=qEntries.find(function(x){return x.id===parseInt(inp.getAttribute('data-eid'));});
      if(ent)ent.slabCanCut=inp.value;
    });
  });

  box.querySelectorAll('.q-sln-d').forEach(function(btn){
    btn.addEventListener('click',function(){
      var eid=parseInt(btn.getAttribute('data-eid'));
      var ent=qEntries.find(function(x){return x.id===eid;});
      if(!ent)return;
      ent.slabNeed=Math.max(0,(parseInt(ent.slabNeed)||0)-1);
      qRenderEntries();
    });
  });
  box.querySelectorAll('.q-sln-u').forEach(function(btn){
    btn.addEventListener('click',function(){
      var eid=parseInt(btn.getAttribute('data-eid'));
      var ent=qEntries.find(function(x){return x.id===eid;});
      if(!ent)return;
      ent.slabNeed=(parseInt(ent.slabNeed)||0)+1;
      qRenderEntries();
    });
  });

  box.querySelectorAll('.q-slc-d').forEach(function(btn){
    btn.addEventListener('click',function(){
      var eid=parseInt(btn.getAttribute('data-eid'));
      var ent=qEntries.find(function(x){return x.id===eid;});
      if(!ent)return;
      ent.slabCanCut=Math.max(0,(parseInt(ent.slabCanCut)||0)-1);
      qRenderEntries();
    });
  });
  box.querySelectorAll('.q-slc-u').forEach(function(btn){
    btn.addEventListener('click',function(){
      var eid=parseInt(btn.getAttribute('data-eid'));
      var ent=qEntries.find(function(x){return x.id===eid;});
      if(!ent)return;
      ent.slabCanCut=(parseInt(ent.slabCanCut)||0)+1;
      qRenderEntries();
    });
  });

  box.querySelectorAll('.q-slb-note').forEach(function(ta){
    ta.addEventListener('input',function(){
      var ent=qEntries.find(function(x){return x.id===parseInt(ta.getAttribute('data-eid'));});
      if(ent)ent.slabNote=ta.value;
    });
  });

  box.querySelectorAll('.q-dc').forEach(function(inp){
    inp.addEventListener('input',function(){
      var ent=qEntries.find(function(x){return x.id===parseInt(inp.getAttribute('data-eid'));});
      if(ent)ent.defectCustom=inp.value;
    });
  });

  box.querySelectorAll('.q-rm').forEach(function(btn){
    btn.addEventListener('click',function(){
      var eid=parseInt(btn.getAttribute('data-eid'));
      qEntries=qEntries.filter(function(x){return x.id!==eid;});
      qRenderEntries();
    });
  });
}

function qAdd(){qEntries.push(qNewEntry());qRenderEntries();}

function qIE(s){var t=document.querySelector('.st[data-s="'+s+'"]');return t?t.checked:true;}
function qFmtDate(d){if(!d)return'—';var p=d.split('-');return pad(parseInt(p[2]))+' '+ENMO[parseInt(p[1])-1]+' '+p[0];}

function qBuild(){
  var L=['📡 แจ้งข้อมูล QIC LINER'];
  if(qIE('qd')){
    L.push('','▶️ แผนการรีดวันที่ : '+qFmtDate($('qD').value));
  }
  if(qIE('qe')){
    var filled=qEntries.filter(function(e){
      return e.status||e.alloy||e.lot||(e.plates&&e.plates.length)||e.defectType;
    });
    if(filled.length){
      filled.forEach(function(e,i){
        L.push('','📌 รายการที่ '+(i+1));
        var sm={qic:'QIC แจ้งคุณภาพ',scrap:'SCRAP'};
        L.push('สถานะ : '+(sm[e.status]||'—'));
        L.push('➡️ Alloy : '+(e.alloy||'—'));
        L.push('➡️ Lot no. : '+(e.lot||'—'));
        L.push('➡️ แผ่นที่ : '+(e.plates&&e.plates.length?e.plates.join(', '):'—'));

        var dd='—';
        if(e.defectType==='oil'){dd='รอยน้ำมันหยด';}
        else if(e.defectType==='crack'){
          var side=e.crackSide?e.crackSide.toUpperCase():'—';
          var dist=e.crackDist?e.crackDist+' mm.':'—';
          dd='รอยแตก (ฝั่ง '+side+' ระยะ '+dist+')';
        }else if(e.defectType==='dent'){
          var dside=e.dentSide?e.dentSide.toUpperCase():'—';
          var ddist=e.dentDist?e.dentDist+' mm.':'—';
          dd='รอยกดทับ (ฝั่ง '+dside+' ระยะ '+ddist+')';
        }else if(e.defectType==='shortSlab'){
          var parts=[];
          if(e.slabLen)parts.push('ความยาวติดลบ '+e.slabLen+' mm.');
          if(e.slabThick)parts.push('ความหนาติดลบ '+e.slabThick+' mm.');
          dd='Slab สั้น ('+(parts.length?parts.join(' / '):'—')+')';
        }else if(e.defectType==='debris'){dd='รอยเศษใต้แผ่น';}
        else if(e.defectType==='custom'){dd=e.defectCustom||'(ยังไม่ระบุ)';}
        L.push('➡️ Defect Detail : '+dd);

        if(e.defectType==='shortSlab'){
          L.push('➡️ ต้องการ : '+(e.slabNeed?e.slabNeed+' แผ่น':'—'));
          L.push('➡️ ตัดจริงได้ : '+(e.slabCanCut?e.slabCanCut+' แผ่น':'—'));
          if(e.slabNote&&e.slabNote.trim())L.push('➡️ หมายเหตุ : '+e.slabNote.trim());
        }

        if(e.position)L.push('➡️ Position : '+e.position.toUpperCase());
      });
    }else{
      L.push('','ยังไม่มีรายการ');
    }
  }
  if(qIE('qf2')){
    var ft=$('qF').value.trim();
    if(ft)L.push('','▶️ '+ft);
  }
  return L.join('\n');
}

function qRenderPreview(){
  var ac=0,tc=0;
  document.querySelectorAll('.st').forEach(function(t){tc++;if(t.checked)ac++;});
  $('qPB').textContent=ac+'/'+tc;
  $('qPBx').textContent=qBuild();
}

function qGH(){try{return JSON.parse(localStorage.getItem(QHK))||[];}catch(e){return[];}}
function qSH(a){localStorage.setItem(QHK,JSON.stringify(a));}

function qSaveToH(){
  var h=qGH();
  var d={
    date:$('qD').value,
    entries:JSON.parse(JSON.stringify(qEntries)),
    footer:$('qF').value,
    toggles:(function(){var tg={};document.querySelectorAll('.st').forEach(function(t){tg[t.getAttribute('data-s')]=t.checked;});return tg;})()
  };
  var m=qBuild();
  var n=new Date();
  h.unshift({id:n.getTime(),at:n.toISOString(),data:d,pre:m.length>300?m.substring(0,300)+'...':m,full:m});
  if(h.length>50)h.pop();
  qSH(h);
  qUB();
}

function qLoadH(id){
  var rec=qGH().find(function(h){return h.id===id;});
  if(!rec)return;
  var d=rec.data;
  $('qD').value=d.date||'';
  qEntries=[];
  if(d.entries&&d.entries.length){
    d.entries.forEach(function(e){
      var n=qNewEntry();
      for(var k in e){if(e.hasOwnProperty(k)&&k!=='id')n[k]=e[k];}
      /* backward compat: ensure new fields exist */
      if(!('dentSide' in n))n.dentSide='';
      if(!('dentDist' in n))n.dentDist='';
      qEntries.push(n);
    });
  }else{qEntries.push(qNewEntry());}
  qRenderEntries();
  $('qF').value=d.footer||'';
  if(d.toggles){
    document.querySelectorAll('.st').forEach(function(t){
      var k=t.getAttribute('data-s');
      if(k in d.toggles){
        t.checked=d.toggles[k];
        var c=t.closest('.card');
        if(c)c.classList.toggle('collapsed',!t.checked);
      }
    });
  }
  qTab(document.querySelector('.page-tab'),'qf');
  showToast('✓ โหลดข้อมูลสำเร็จ!');
}

function qDelH(id){
  if(!confirm('ลบ?'))return;
  qSH(qGH().filter(function(h){return h.id!==id;}));
  qRenderHistory();
  qUB();
}

function qClrH(){
  if(!confirm('ลบทั้งหมด?'))return;
  qSH([]);
  qRenderHistory();
  qUB();
}

function qUB(){
  var c=qGH().length,b=$('qB');
  if(c>0){b.style.display='inline-block';b.textContent=c;}
  else b.style.display='none';
}

function qRenderHistory(){
  var c=$('qHC'),h=qGH();
  if(!h.length){
    c.innerHTML='<div class="history-empty"><span class="h-icon">📡</span><h3>ยังไม่มีประวัติ</h3><p>กด Copy เพื่อบันทึกอัตโนมัติ</p></div>';
    return;
  }
  var mo=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  var html='<div class="history-count-bar"><span>📊 '+h.length+' รายการ</span>'
    +'<button class="btn btn-clr" onclick="qClrH()">🗑️ ลบทั้งหมด</button></div>'
    +'<div class="history-list">';
  h.forEach(function(r){
    var d=r.data,sv=new Date(r.at);
    var ec=d.entries?d.entries.length:0;
    html+='<div class="history-item">'
      +'<div class="history-head" onclick="this.parentNode.classList.toggle(\'open\')">'
        +'<div class="h-date"><span class="h-day">'+sv.getDate()+'</span><span class="h-month">'+mo[sv.getMonth()]+'</span></div>'
        +'<div class="h-info">'
          +'<div class="h-title">QIC LINER — '+ec+' รายการ</div>'
          +'<div class="h-sub">'+qFmtDate(d.date)+' · '+pad(sv.getHours())+':'+pad(sv.getMinutes())+'</div>'
        +'</div>'
        +'<span class="h-arrow">▼</span>'
      +'</div>'
      +'<div class="history-detail"><div class="history-detail-inner">'
        +'<div class="history-preview">'+esc(r.pre)+'</div>'
        +'<div class="history-actions">'
          +'<button class="btn btn-load" onclick="qLoadH('+r.id+')">📥 โหลด</button>'
          +'<button class="btn btn-del-h" onclick="qDelH('+r.id+')">🗑️ ลบ</button>'
        +'</div></div></div></div>';
  });
  html+='</div>';
  c.innerHTML=html;
}

/* Copy with SCRAP warning */
function qDoCopy(){
  var hasScrap=qEntries.some(function(e){return e.status==='scrap';});
  if(hasScrap){
    showScrapModal(function(){
      qSaveToH();
      doClip(qBuild());
    });
  }else{
    qSaveToH();
    doClip(qBuild());
  }
}

function qDoReset(){
  if(!confirm('ล้างทั้งหมด?'))return;
  $('qD').value=new Date().toISOString().split('T')[0];
  qEntries=[qNewEntry()];
  qRenderEntries();
  $('qF').value='ฝากทาง PC พิจารณา Back Up งานให้หน่อยครับ 🙏🏻 ขอบคุณครับ 🙏🏻';
  document.querySelectorAll('.st').forEach(function(t){t.checked=true;});
  document.querySelectorAll('.card').forEach(function(c){c.classList.remove('collapsed');});
}

qRenderEntries();
qUB();
</script>
